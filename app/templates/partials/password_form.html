<form id="password-form" class="mt-5 space-y-5" hx-post="/settings/password" hx-target="#password-form" hx-swap="outerHTML" autocomplete="on">
  {# Hidden username helps password managers save the new password against the right account. #}
  <input type="text" name="username" value="{{ user.username }}" autocomplete="username" class="hidden" readonly tabindex="-1" aria-hidden="true">
  {% if done %}
  <p class="arrive flex items-center gap-2 rounded-2xl bg-rise-50 px-4 py-3 text-[15px] font-medium text-rise">
    <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m5 12 5 5L20 7"/></svg>
    Password changed. Any other devices signed in as you have been signed out.
  </p>
  {% endif %}
  <div>
    <label class="label" for="current">Current password</label>
    <input id="current" name="current" type="password" required autocomplete="current-password" class="field sm:max-w-sm">
  </div>
  <div class="grid gap-5 sm:grid-cols-2">
    <div>
      <label class="label" for="new">New password</label>
      <input id="new" name="new" type="password" required minlength="8" maxlength="128" autocomplete="new-password" class="field">
      <p class="mt-1.5 text-sm text-ink-soft">At least 8 characters.</p>
    </div>
    <div>
      <label class="label" for="confirm">New password again</label>
      <input id="confirm" name="confirm" type="password" required minlength="8" maxlength="128" autocomplete="new-password" class="field">
    </div>
  </div>
  <button class="btn-primary htmx-busy">Change password</button>
</form>
